name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# android/ is not committed: each job generates it with `flutter create` and applies
# android-templates/ through scripts/prepare-android.sh (same toolchain as 913-plan).
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Restore debug keystore cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Cotext Debug,O=SurCommunication,C=JP"

      - name: Generate Android project
        run: bash scripts/prepare-android.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cotext-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: bash scripts/prepare-android.sh

      - name: Write upload signing files from secrets
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyPassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Check the bundle is signed with the upload key
        run: |
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab | grep -q "jar verified"
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "Owner:"
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "Android Debug"; then
            echo "Bundle is debug-signed: key.properties was not picked up"; exit 1
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: cotext-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
